name: Unit Tests

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Check disabled chat fence foundation and compiled offline workflow
        run: pnpm test:chat-fence-foundation

      - name: Check response contract types
        run: pnpm typecheck:response-contracts

      - name: Check release format contract types
        run: pnpm typecheck:release-format
