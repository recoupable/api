name: Unit Tests

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Check disabled chat fence foundation and compiled offline workflow
        run: pnpm test:chat-fence-foundation

      - name: Check actual internal fenced workflow with offline effect seams
        run: pnpm test:chat-fence-workflow

      - name: Check unwired pack scheduler replay with offline effects
        run: pnpm test:pack-scheduler-workflow

      - name: Check unwired pack foundation with offline durable ports
        run: pnpm test:pack-foundation-workflow

      - name: Check unwired pack admission wait and restart
        run: pnpm test:pack-admission-workflow

      - name: Check actual unwired pack foundation port compilation
        run: |
          PACK_FOUNDATION_PORTS_COMPILE_OUTPUT=./pack-foundation-ports-compile.json node scripts/pack-foundation-durable-ports-compile.mjs
          test -s pack-foundation-ports-compile.json

      - name: Check production TypeScript configuration
        run: pnpm exec tsc --noEmit --project tsconfig.build.json

      - name: Check response contract types
        run: pnpm typecheck:response-contracts

      - name: Check release format contract types
        run: pnpm typecheck:release-format
